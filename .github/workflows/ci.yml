name: CI

on:
  push:
    branches: [main, dev-branch]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          activate-environment: true  # creates .venv and puts it on PATH for later steps
      - name: Install dependencies
        # CPU-only PyTorch: same results for our embedding model, ~2 GB smaller than the CUDA build
        run: >
          uv pip install -r requirements.txt
          --extra-index-url https://download.pytorch.org/whl/cpu --index-strategy unsafe-best-match
      - name: Lint and format
        run: |
          ruff check .
          ruff format --check .
      - name: Check no secrets are committed
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then echo ".env is committed!"; exit 1; fi
      - name: Test (offline — fake LLMs, mock providers, in-memory Qdrant) with coverage gate
        run: pytest --cov=src --cov-report=term-missing --cov-fail-under=80

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Type-check and build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [test, frontend]
    steps:
      - uses: actions/checkout@v5
      - name: Build image (installs deps, builds the RAG index, downloads the model)
        # one retry: base-image pulls occasionally fail transiently (seen once, same commit passed later)
        run: docker build -t finnie:ci . || (sleep 20 && docker build -t finnie:ci .)
      - name: Smoke-test the image (no API keys → offline fallbacks)
        run: |
          docker run -d --name finnie -p 8000:8000 -e HF_HUB_OFFLINE=1 finnie:ci
          for i in $(seq 1 45); do
            if curl -sf http://localhost:8000/api/health; then
              curl -sf http://localhost:8000/ | grep -q '<div id="root">'  # React app is served
              curl -sf -X POST http://localhost:8000/api/goals/plan -H 'Content-Type: application/json'                 -d '{"target_amount": 10000, "years": 3}' | grep -q target_in_future_dollars
              exit 0
            fi
            sleep 2
          done
          docker logs finnie; exit 1
